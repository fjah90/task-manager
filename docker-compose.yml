services:
  postgres:
    image: postgres:16-alpine
    container_name: task-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskmgr
      POSTGRES_PASSWORD: taskmgr
      POSTGRES_DB: taskmgr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmgr -d taskmgr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
