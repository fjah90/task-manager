services:
  postgres:
    image: postgres:16-alpine
    container_name: task-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskmgr
      POSTGRES_PASSWORD: taskmgr
      POSTGRES_DB: taskmgr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmgr -d taskmgr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: task-manager-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://taskmgr:taskmgr@postgres:5432/taskmgr?schema=public
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 1d
      PORT: 4000
      CORS_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: task-manager-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      API_INTERNAL_URL: http://task-manager-api:4000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
